# Home Assistant add-on manifest. The add-on is built from this repository's
# own Dockerfile on the Home Assistant host; there is no prebuilt image.
# Bump "version" to make Home Assistant offer an update and rebuild.
name: Firefly Pico
version: "0.2.4-dev3"
slug: firefly_pico
description: Firefly III companion app for quick transaction entry (fork)
url: https://github.com/alstanchev/firefly-pico
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
webui: http://[HOST]:[PORT:80]
ports:
  80/tcp: 6976
ports_description:
  80/tcp: Web interface
map:
  - type: addon_config
    read_only: false
    path: /var/www/html/database/data
options:
  firefly_url: ""
  assistant_llm_api_key: ""
  assistant_llm_endpoint: ""
  assistant_llm_model: ""
  assistant_llm_context: ""
  assistant_transcription_api_key: ""
  assistant_transcription_endpoint: ""
  assistant_transcription_model: ""
  assistant_transcription_language: ""
schema:
  firefly_url: url
  assistant_llm_api_key: password?
  assistant_llm_endpoint: str?
  assistant_llm_model: str?
  assistant_llm_context: str?
  assistant_transcription_api_key: password?
  assistant_transcription_endpoint: str?
  assistant_transcription_model: str?
  assistant_transcription_language: str?
